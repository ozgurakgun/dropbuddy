[[permission]]
identifier = "allow-ensure-inbox"
description = "Ensure DropBuddy inbox directory exists"
commands.allow = ["ensure_inbox"]

[[permission]]
identifier = "allow-list-inbox-files"
description = "List scanned files in the DropBuddy inbox"
commands.allow = ["list_inbox_files"]

[[permission]]
identifier = "allow-read-inbox-file"
description = "Read a scanned file from the DropBuddy inbox as a data URL"
commands.allow = ["read_inbox_file"]

[[permission]]
identifier = "allow-ocr-inbox-file"
description = "Run local tesseract OCR on an inbox scan"
commands.allow = ["ocr_inbox_file"]

[[permission]]
identifier = "allow-open-inbox-folder"
description = "Reveal the DropBuddy inbox in Finder"
commands.allow = ["open_inbox_folder"]

[[permission]]
identifier = "allow-open-scanner-app"
description = "Open Image Capture to run the Epson ES-50"
commands.allow = ["open_scanner_app"]
