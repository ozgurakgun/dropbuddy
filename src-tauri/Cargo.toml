[package]
name = "dropbuddy"
version = "0.1.0"
description = "DropBuddy kitchen dispatch"
authors = ["DropBuddy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
dirs = "6"
notify = "7"
base64 = "0.22"
