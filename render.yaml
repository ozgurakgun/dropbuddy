# Render Blueprint — https://render.com/docs/infrastructure-as-code
# Next.js web service + managed Postgres (workforce / timetabling pattern).

services:
  - type: web
    name: dropbuddy
    runtime: node
    plan: starter
    region: frankfurt
    previews:
      generation: manual
    buildCommand: npm install --include=dev && npm run render:build
    preDeployCommand: npm run render:migrate
    startCommand: npm start
    healthCheckPath: /api/system/status
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dropbuddy-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: dropbuddy-db
    plan: basic-256mb
    region: frankfurt
    diskSizeGB: 1
    databaseName: dropbuddy
    user: dropbuddy
